<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 · 站点导航</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script>
  (function () {
    var t = localStorage.getItem('nav-theme');
    if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  :root {
    --bg: #0b0f17; --bg-glow: #14243f; --card: #121a2a; --card-hover: #182238;
    --border: #1e2a42; --border-strong: #2c3d63; --text: #e6edf6; --dim: #8b98ad;
    --accent: #6ea8fe; --accent-soft: rgba(110,168,254,.12); --accent-hover: rgba(110,168,254,.25);
    --green: #3fb96f; --red: #e05a5a; --orange: #e0a44a; --gray: #55637a; --mask: rgba(4,8,16,.66);
    --input-bg: #0b0f17; --shadow: 0 10px 30px rgba(0,0,0,.35); --fav-bg: rgba(255,255,255,.06);
  }
  :root[data-theme="light"] {
    --bg: #f4f6fb; --bg-glow: #dbe7fb; --card: #ffffff; --card-hover: #f2f6ff;
    --border: #e2e8f2; --border-strong: #b9cdf0; --text: #1a2233; --dim: #5b6779;
    --accent: #2f6fe0; --accent-soft: rgba(47,111,224,.09); --accent-hover: rgba(47,111,224,.18);
    --green: #2e9e57; --red: #d64545; --orange: #c98a2e; --gray: #8a96a8; --mask: rgba(20,30,50,.45);
    --input-bg: #ffffff; --shadow: 0 10px 30px rgba(30,60,120,.12); --fav-bg: rgba(20,40,80,.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
    background: radial-gradient(ellipse 60% 40% at 50% -10%, var(--bg-glow), transparent 70%);
  }
  a { color: var(--accent); text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 26px 20px 80px; }

  /* ---------- 顶栏 ---------- */
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .top h1 { font-size: 19px; font-weight: 800; flex: 1; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--dim); font-size: 15px; transition: .15s;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { color: var(--accent); border-color: var(--border-strong); }

  /* ---------- 登录卡 ---------- */
  .auth-card {
    max-width: 400px; margin: 70px auto; background: var(--card); border: 1px solid var(--border-strong);
    border-radius: 16px; padding: 30px; box-shadow: var(--shadow);
  }
  .auth-card h2 { font-size: 18px; margin-bottom: 6px; }
  .auth-card p { color: var(--dim); font-size: 13px; margin-bottom: 18px; }
  .err { color: var(--red); font-size: 12.5px; min-height: 17px; margin-top: 8px; }

  /* ---------- 统计卡 ---------- */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat {
    background: var(--card); border: 1px solid var(--border); border-radius: 13px; padding: 14px 16px;
  }
  .stat .v { font-size: 24px; font-weight: 800; }
  .stat .k { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .stat.g .v { color: var(--green); } .stat.r .v { color: var(--red); }

  /* ---------- 标签页 ---------- */
  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--border); margin-bottom: 18px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 9px 16px; border: none; background: none; color: var(--dim); font-size: 13.5px; font-weight: 500;
    border-bottom: 2px solid transparent; white-space: nowrap; transition: .15s;
  }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
  .pane { display: none; } .pane.on { display: block; }

  /* ---------- 通用 ---------- */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 13px; padding: 18px; margin-bottom: 14px; }
  .card h3 { font-size: 14.5px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .card h3 .hint { font-size: 12px; color: var(--dim); font-weight: 400; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  input, select, textarea {
    padding: 9px 12px; border-radius: 9px; border: 1px solid var(--border); background: var(--input-bg);
    color: var(--text); font-size: 13.5px; outline: none; transition: .15s; font-family: inherit;
  }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .btn {
    padding: 9px 16px; border-radius: 9px; border: none; font-size: 13px; font-weight: 600; transition: .15s;
    background: linear-gradient(135deg, var(--accent), #7cc7ff); color: #fff;
  }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.05); }
  .btn:disabled { opacity: .5; pointer-events: none; }
  .btn-ghost { padding: 8px 14px; border-radius: 9px; border: 1px solid var(--border); background: transparent; color: var(--dim); font-size: 12.5px; }
  .btn-ghost:hover { color: var(--text); border-color: var(--border-strong); }
  .btn-danger { padding: 8px 14px; border-radius: 9px; border: 1px solid transparent; background: transparent; color: var(--red); font-size: 12.5px; }
  .btn-danger:hover { background: rgba(224,90,90,.1); border-color: var(--red); }
  .grow { flex: 1; min-width: 160px; }

  /* ---------- 站点表 ---------- */
  .site-row {
    display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 11px;
    border: 1px solid var(--border); margin-bottom: 8px; background: var(--card); transition: .15s;
  }
  .site-row:hover { border-color: var(--border-strong); }
  .fav {
    width: 34px; height: 34px; flex: none; border-radius: 9px; background: var(--fav-bg); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; overflow: hidden; font-weight: 700; font-size: 14px; color: #fff;
  }
  .fav img { width: 20px; height: 20px; border-radius: 4px; }
  .fav span { display: none; }
  .fav.noimg span, .fav.hide-img span { display: block; }
  .s-info { flex: 1; min-width: 0; }
  .s-name { font-size: 13.5px; font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .s-url { font-size: 11.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 10.5px; padding: 1px 8px; border-radius: 999px; font-weight: 600; }
  .badge.online { background: rgba(63,185,111,.15); color: var(--green); }
  .badge.offline { background: rgba(138,150,168,.15); color: var(--gray); }
  .badge.custom { background: var(--accent-soft); color: var(--accent); }
  .badge.hidden { background: rgba(224,90,90,.12); color: var(--red); }
  .badge.ghost { background: rgba(224,164,74,.14); color: var(--orange); }

  /* ---------- 账号 chips ---------- */
  .chip {
    display: inline-flex; align-items: center; gap: 7px; padding: 7px 8px 7px 14px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--border); font-size: 13px; font-weight: 600;
  }
  .chip .x {
    width: 20px; height: 20px; border-radius: 50%; border: none; background: var(--fav-bg); color: var(--dim);
    font-size: 12px; display: flex; align-items: center; justify-content: center; transition: .15s;
  }
  .chip .x:hover { background: rgba(224,90,90,.18); color: var(--red); }
  .chip .x:disabled { opacity: .3; pointer-events: none; }

  /* ---------- 日志 ---------- */
  .log-box {
    background: var(--input-bg); border: 1px solid var(--border); border-radius: 11px; padding: 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.75;
    white-space: pre-wrap; word-break: break-all; max-height: 420px; overflow: auto; color: var(--dim);
  }
  .log-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--dim); }

  /* ---------- toast ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(20px); z-index: 200;
    background: var(--card); border: 1px solid var(--border-strong); color: var(--text);
    padding: 11px 20px; border-radius: 11px; font-size: 13.5px; box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transition: .25s;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.ok { border-color: var(--green); } #toast.bad { border-color: var(--red); }
  .spin { display: inline-block; animation: r 1s linear infinite; } @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>⚙️ 管理后台</h1>
    <button class="icon-btn" id="themeBtn" title="切换主题">🌙</button>
    <a class="icon-btn" href="/" title="返回导航站">🏠</a>
  </div>

  <!-- 未登录 -->
  <div class="auth-card" id="authCard" style="display:none">
    <h2 id="authTitle">管理员登录</h2>
    <p id="authDesc">输入管理密码以进入后台</p>
    <input type="password" id="pwd" class="grow" style="width:100%" placeholder="管理密码（至少 6 位）" autocomplete="current-password">
    <div class="err" id="authErr"></div>
    <button class="btn" id="authBtn" style="width:100%">进入后台</button>
  </div>

  <!-- 已登录 -->
  <div id="panel" style="display:none">
    <div class="stats" id="stats"></div>

    <div class="tabs">
      <button class="tab on" data-p="sites">站点管理</button>
      <button class="tab" data-p="owners">扫描账号</button>
      <button class="tab" data-p="manual">手动站点 / 收藏</button>
      <button class="tab" data-p="settings">系统设置</button>
      <button class="tab" data-p="logs">扫描日志</button>
    </div>

    <!-- 站点管理 -->
    <div class="pane on" id="p-sites">
      <div class="card">
        <div class="row" style="margin-bottom:12px">
          <input id="siteFilter" class="grow" placeholder="筛选站点…">
          <button class="btn-ghost" id="btnScan">⟳ 立即扫描</button>
          <button class="btn-ghost" id="btnRefresh">刷新</button>
        </div>
        <div id="siteList"></div>
      </div>
    </div>

    <!-- 扫描账号 -->
    <div class="pane" id="p-owners">
      <div class="card">
        <h3>扫描账号 <span class="hint">这些 GitHub 账号名下的 Pages 站点会被自动收录</span></h3>
        <div class="row" id="ownerChips" style="margin-bottom:14px"></div>
        <div class="row">
          <input id="ownerInput" class="grow" placeholder="GitHub 用户名，如 xiyan122">
          <button class="btn" id="ownerAdd">添加账号</button>
        </div>
      </div>
    </div>

    <!-- 手动站点 / 收藏 -->
    <div class="pane" id="p-manual">
      <div class="card">
        <h3>添加手动站点或收藏</h3>
        <div class="row" style="margin-bottom:10px">
          <select id="mCat" style="flex:none">
            <option value="collect">收藏夹</option>
            <option value="self">自建站</option>
            <option value="">幽灵站补录（Pages 已删但域名还活着）</option>
          </select>
          <input id="mOwner" class="grow" placeholder="所属账号（幽灵站必填）" style="display:none">
        </div>
        <div class="row" style="margin-bottom:10px">
          <input id="mName" class="grow" placeholder="名称 *">
          <input id="mUrl" class="grow" placeholder="https://… *">
        </div>
        <div class="row">
          <input id="mDesc" class="grow" placeholder="描述（可选）">
          <button class="btn" id="mAdd">添加</button>
        </div>
      </div>
      <div class="card">
        <h3>已有条目</h3>
        <div id="manualList"></div>
      </div>
    </div>

    <!-- 系统设置 -->
    <div class="pane" id="p-settings">
      <div class="card">
        <h3>GitHub 扫描令牌 <span class="hint" id="tokenState"></span></h3>
        <p style="color:var(--dim);font-size:12.5px;margin-bottom:12px">
          Fine-grained PAT · All repositories · 仅需 Metadata 只读权限。配置后扫描 100% 覆盖（含私有仓库与搜索盲区）。
          <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">去创建 →</a>
        </p>
        <div class="row">
          <input id="tokenInput" type="password" class="grow" placeholder="github_pat_…（留空表示不修改）">
          <button class="btn" id="tokenSave">保存令牌</button>
          <button class="btn-danger" id="tokenClear">清除</button>
        </div>
      </div>
      <div class="card">
        <h3>Worker 信息</h3>
        <div style="color:var(--dim);font-size:13px;line-height:2" id="sysInfo"></div>
      </div>
      <div class="card">
        <h3>会话</h3>
        <button class="btn-ghost" id="btnLogout">退出登录</button>
      </div>
    </div>

    <!-- 扫描日志 -->
    <div class="pane" id="p-logs">
      <div class="card">
        <div class="log-meta" id="logMeta"></div>
        <div class="log-box" id="logBox">暂无日志</div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (x) => String(x ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ST = null; // /api/admin/state

/* ---------- 主题 / toast ---------- */
$('#themeBtn').onclick = () => {
  const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = t; localStorage.setItem('nav-theme', t);
  $('#themeBtn').textContent = t === 'light' ? '☀️' : '🌙';
};
$('#themeBtn').textContent = document.documentElement.dataset.theme === 'light' ? '☀️' : '🌙';
let toastTimer;
function toast(msg, ok = true) {
  const el = $('#toast'); el.textContent = msg;
  el.className = 'show ' + (ok ? 'ok' : 'bad');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.className = ''), 2600);
}

/* ---------- API 封装 ---------- */
async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { showAuth(false); throw new Error(d.error || '未登录'); }
  if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
  return d;
}
const POST = (path, body) => api(path, { method: 'POST', body: JSON.stringify(body || {}) });
const DEL = (path, body) => api(path, { method: 'DELETE', body: JSON.stringify(body || {}) });

/* ---------- 登录 ---------- */
function showAuth(setup) {
  $('#panel').style.display = 'none';
  $('#authCard').style.display = 'block';
  $('#authTitle').textContent = setup ? '初始化后台' : '管理员登录';
  $('#authDesc').textContent = setup ? '首次使用，请设置管理密码（至少 6 位）' : '输入管理密码以进入后台';
  $('#authBtn').textContent = setup ? '设置并进入' : '进入后台';
  $('#pwd').value = ''; $('#authErr').textContent = '';
}
$('#authBtn').onclick = async () => {
  const pwd = $('#pwd').value;
  if (!pwd) return ($('#authErr').textContent = '请输入密码');
  $('#authBtn').disabled = true; $('#authErr').textContent = '';
  try {
    const ep = $('#authBtn').textContent.includes('初始化') || $('#authDesc').textContent.includes('首次') ? '/api/setup' : '/api/login';
    await POST(ep, { password: pwd });
    $('#authCard').style.display = 'none';
    await boot();
  } catch (e) { $('#authErr').textContent = e.message; }
  finally { $('#authBtn').disabled = false; }
};
$('#pwd').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#authBtn').click(); });
$('#btnLogout').onclick = async () => { await POST('/api/logout'); showAuth(false); };

/* ---------- favicon ---------- */
window.favErr = (el) => {
  if (el.dataset.fb === '1' || !el.dataset.avatar) { el.parentElement.classList.add('hide-img'); return; }
  el.dataset.fb = '1';
  el.src = el.dataset.avatar;
};
function favHTML(s) {
  let host = ''; try { host = new URL(s.url).origin; } catch {}
  const letter = (s.repo || '?').charAt(0).toUpperCase();
  const hue = [...(s.repo + (s.owner || ''))].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);
  const avatar = s.owner ? `https://github.com/${encodeURIComponent(s.owner)}.png?size=64` : '';
  const img = host ? `<img src="${host}/favicon.ico" data-avatar="${esc(avatar)}" loading="lazy" onerror="favErr(this)">` : '';
  return `<div class="fav${host ? '' : ' noimg'}" style="background:linear-gradient(135deg,hsl(${hue},60%,45%),hsl(${(hue+40)%360},60%,38%))">${img}<span>${letter}</span></div>`;
}

/* ---------- 渲染：统计 ---------- */
function renderStats() {
  const sites = ST.sites || [];
  const online = sites.filter((s) => s.status === 'online').length;
  const custom = sites.filter((s) => s.status === 'custom').length;
  const cards = [
    { v: sites.length, k: '站点总数' },
    { v: online, k: '在线', cls: 'g' },
    { v: sites.length - online - custom, k: '离线', cls: 'r' },
    { v: custom, k: '收藏/自建' },
    { v: (ST.config.owners || []).length, k: '扫描账号' },
  ];
  $('#stats').innerHTML = cards.map((c) => `<div class="stat ${c.cls || ''}"><div class="v">${c.v}</div><div class="k">${c.k}</div></div>`).join('');
}

/* ---------- 渲染：站点 ---------- */
function renderSites() {
  const kw = ($('#siteFilter').value || '').toLowerCase();
  const list = (ST.sites || []).filter((s) =>
    !kw || [s.repo, s.url, s.owner, s.description].join(' ').toLowerCase().includes(kw));
  $('#siteList').innerHTML = list.length ? list.map((s) => {
    const hidden = (ST.config.exclude || []).some((e) => e.repo === s.repo && (e.owner || '').toLowerCase() === (s.owner || '').toLowerCase());
    const badge = hidden ? '<span class="badge hidden">已隐藏</span>'
      : s.status === 'online' ? '<span class="badge online">在线</span>'
      : s.status === 'custom' ? '<span class="badge custom">收藏</span>'
      : s.status === 'offline' ? '<span class="badge offline">离线</span>' : '';
    const ghost = s.manual ? '<span class="badge ghost">手动</span>' : '';
    const canHide = s.status !== 'custom';
    const canDel = s.manual || s.status === 'custom';
    return `<div class="site-row">
      ${favHTML(s)}
      <div class="s-info">
        <div class="s-name">${esc(s.repo)} ${badge} ${ghost} <span style="color:var(--dim);font-weight:400;font-size:11.5px">@${esc(s.owner || '')}</span></div>
        <div class="s-url">${esc(s.description || s.url)}</div>
      </div>
      ${canHide ? `<button class="btn-ghost" data-hide="${esc(s.repo)}|${esc(s.owner)}|${hidden ? 0 : 1}">${hidden ? '恢复' : '隐藏'}</button>` : ''}
      ${canDel ? `<button class="btn-danger" data-del="${esc(s.repo)}|${esc(s.cat || '')}">删除</button>` : ''}
    </div>`;
  }).join('') : '<div style="color:var(--dim);text-align:center;padding:20px">无匹配站点</div>';

  $('#siteList').querySelectorAll('[data-hide]').forEach((b) => b.onclick = async () => {
    const [repo, owner, hide] = b.dataset.hide.split('|');
    b.disabled = true;
    try { await POST('/api/admin/exclude', { repo, owner, hide: hide === '1' }); toast(hide === '1' ? '已隐藏' : '已恢复'); await loadState(); }
    catch (e) { toast(e.message, false); b.disabled = false; }
  });
  $('#siteList').querySelectorAll('[data-del]').forEach((b) => b.onclick = async () => {
    const [repo, cat] = b.dataset.del.split('|');
    if (!confirm(`确认删除「${repo}」？`)) return;
    b.disabled = true;
    try { await DEL('/api/admin/manual', { repo, cat }); toast('已删除'); await loadState(); }
    catch (e) { toast(e.message, false); b.disabled = false; }
  });
}
$('#siteFilter').addEventListener('input', renderSites);

/* ---------- 渲染：账号 ---------- */
function renderOwners() {
  const self = (ST.owner || '').toLowerCase();
  $('#ownerChips').innerHTML = (ST.config.owners || []).map((o) => `
    <span class="chip">@${esc(o)}
      <button class="x" data-o="${esc(o)}" title="${o.toLowerCase() === self ? '主账号不可移除' : '移除'}"${o.toLowerCase() === self ? ' disabled' : ''}>✕</button>
    </span>`).join('');
  $('#ownerChips').querySelectorAll('.x').forEach((b) => b.onclick = async () => {
    if (!confirm(`移除账号 @${b.dataset.o}？（其站点将从自动收录中消失，已有数据保留到下次扫描）`)) return;
    b.disabled = true;
    try { await DEL('/api/admin/owner', { name: b.dataset.o }); toast('已移除'); await loadState(); }
    catch (e) { toast(e.message, false); b.disabled = false; }
  });
}
$('#ownerAdd').onclick = async () => {
  const name = $('#ownerInput').value.trim();
  if (!name) return toast('请输入用户名', false);
  $('#ownerAdd').disabled = true;
  try { await POST('/api/admin/owner', { name }); $('#ownerInput').value = ''; toast(`已添加 @${name}，点击「立即扫描」生效`); await loadState(); }
  catch (e) { toast(e.message, false); }
  finally { $('#ownerAdd').disabled = false; }
};

/* ---------- 渲染：手动站点 ---------- */
function renderManual() {
  const list = (ST.config.extraSites || []);
  const catName = { collect: '收藏夹', self: '自建站', '': '幽灵站' };
  $('#manualList').innerHTML = list.length ? list.map((e) => `
    <div class="site-row">
      <span class="badge ${e.cat ? 'custom' : 'ghost'}">${catName[e.cat] || '幽灵站'}</span>
      <div class="s-info">
        <div class="s-name">${esc(e.repo)}</div>
        <div class="s-url">${esc(e.url)}${e.owner ? ' · @' + esc(e.owner) : ''}</div>
      </div>
      <button class="btn-danger" data-mdel="${esc(e.repo)}|${esc(e.cat || '')}">删除</button>
    </div>`).join('') : '<div style="color:var(--dim);text-align:center;padding:12px">暂无手动条目</div>';
  $('#manualList').querySelectorAll('[data-mdel]').forEach((b) => b.onclick = async () => {
    const [repo, cat] = b.dataset.mdel.split('|');
    if (!confirm(`确认删除「${repo}」？`)) return;
    b.disabled = true;
    try { await DEL('/api/admin/manual', { repo, cat }); toast('已删除'); await loadState(); }
    catch (e) { toast(e.message, false); b.disabled = false; }
  });
}
$('#mCat').addEventListener('change', () => {
  $('#mOwner').style.display = $('#mCat').value === '' ? '' : 'none';
});
$('#mAdd').onclick = async () => {
  const repo = $('#mName').value.trim(), url = $('#mUrl').value.trim();
  if (!repo || !url) return toast('名称和网址必填', false);
  $('#mAdd').disabled = true;
  try {
    await POST('/api/admin/manual', { repo, url, description: $('#mDesc').value.trim(), cat: $('#mCat').value, owner: $('#mOwner').value.trim() });
    $('#mName').value = $('#mUrl').value = $('#mDesc').value = $('#mOwner').value = '';
    toast('已添加并触发重新扫描');
    await loadState();
  } catch (e) { toast(e.message, false); }
  finally { $('#mAdd').disabled = false; }
};

/* ---------- 设置 ---------- */
function renderSettings() {
  $('#tokenState').textContent = ST.hasToken ? '✅ 已配置' : '⚠️ 未配置（匿名扫描，覆盖不完整）';
  $('#tokenState').style.color = ST.hasToken ? 'var(--green)' : 'var(--orange)';
  $('#sysInfo').innerHTML = `
    主账号：<b style="color:var(--text)">@${esc(ST.owner)}</b><br>
    数据更新：${esc(ST.updated_at || '—')}<br>
    每日自动扫描：Cron <code>30 0 * * *</code>（UTC，即北京时间 08:30）<br>
    Worker 名称：site-nav · 部署仓库：<a href="https://github.com/pengyuyan29/site-nav" target="_blank" rel="noopener">pengyuyan29/site-nav</a>`;
}
$('#tokenSave').onclick = async () => {
  const t = $('#tokenInput').value.trim();
  if (!t) return toast('请粘贴令牌', false);
  $('#tokenSave').disabled = true;
  try { await POST('/api/admin/token', { token: t }); $('#tokenInput').value = ''; toast('令牌已保存，建议立即扫描验证'); await loadState(); }
  catch (e) { toast(e.message, false); }
  finally { $('#tokenSave').disabled = false; }
};
$('#tokenClear').onclick = async () => {
  if (!confirm('确认清除扫描令牌？')) return;
  try { await POST('/api/admin/token', { token: '' }); toast('已清除'); await loadState(); }
  catch (e) { toast(e.message, false); }
};

/* ---------- 日志 ---------- */
function renderLogs() {
  const L = ST.lastScan;
  if (!L) { $('#logMeta').innerHTML = '尚未执行过扫描'; $('#logBox').textContent = '点击「立即扫描」或等待定时任务'; return; }
  const trig = { cron: '⏰ 定时', manual: '🖱️ 手动', 'manual-edit': '✏️ 配置变更' }[L.trigger] || L.trigger;
  $('#logMeta').innerHTML = `<span class="badge custom">${trig}</span> <span>${esc((L.time || '').replace('T', ' ').slice(0, 19))} UTC</span> <b style="color:var(--text)">${esc(L.summary || '')}</b>`;
  $('#logBox').textContent = (L.lines || []).join('\n');
}

/* ---------- 扫描按钮 ---------- */
$('#btnScan').onclick = async () => {
  const b = $('#btnScan'); b.disabled = true;
  b.innerHTML = '<span class="spin">⟳</span> 扫描中…（约 10-30 秒）';
  try { const r = await POST('/api/admin/scan'); toast('扫描完成：' + (r.log.summary || '')); await loadState(); }
  catch (e) { toast(e.message, false); }
  finally { b.disabled = false; b.innerHTML = '⟳ 立即扫描'; }
};
$('#btnRefresh').onclick = () => loadState().then(() => toast('已刷新'));

/* ---------- 标签页 ---------- */
document.querySelectorAll('.tab').forEach((t) => t.onclick = () => {
  document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === t));
  document.querySelectorAll('.pane').forEach((p) => p.classList.toggle('on', p.id === 'p-' + t.dataset.p));
});

/* ---------- 启动 ---------- */
async function loadState() {
  ST = await api('/api/admin/state');
  renderStats(); renderSites(); renderOwners(); renderManual(); renderSettings(); renderLogs();
}
async function boot() {
  try { await loadState(); $('#panel').style.display = 'block'; }
  catch (e) { /* 401 时 api() 已处理 */ }
}
(async function init() {
  try {
    const s = await fetch('/api/auth-state').then((r) => r.json());
    if (s.initialized) {
      // 已初始化：尝试用现有会话直接进入，失败则显示登录
      try { await loadState(); $('#panel').style.display = 'block'; }
      catch { showAuth(false); }
    } else showAuth(true);
  } catch { showAuth(false); }
})();
</script>
</body>
</html>
