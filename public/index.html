<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>站点导航 · pengyuyan29</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="pengyuyan29 的站点索引：GitHub Pages、自建站与收藏夹，每日自动同步">
<script>
  (function () {
    var t = localStorage.getItem('nav-theme');
    if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  :root {
    --bg: #0b0f17; --bg-glow: #14243f; --card: #121a2a; --card-hover: #182238;
    --border: #1e2a42; --border-strong: #2c3d63; --text: #e6edf6; --dim: #8b98ad;
    --accent: #6ea8fe; --accent-soft: rgba(110,168,254,.12); --accent-hover: rgba(110,168,254,.25);
    --green: #3fb96f; --red: #e05a5a; --gray: #55637a; --mask: rgba(4,8,16,.66);
    --bg-blur: rgba(11,15,23,.85); --chip-bg: rgba(110,168,254,.12); --input-bg: #0b0f17;
    --shadow: 0 10px 30px rgba(0,0,0,.35); --shadow-lg: 0 20px 50px rgba(0,0,0,.5);
    --fav-bg: rgba(255,255,255,.06);
  }
  :root[data-theme="light"] {
    --bg: #f4f6fb; --bg-glow: #dbe7fb; --card: #ffffff; --card-hover: #f2f6ff;
    --border: #e2e8f2; --border-strong: #b9cdf0; --text: #1a2233; --dim: #5b6779;
    --accent: #2f6fe0; --accent-soft: rgba(47,111,224,.09); --accent-hover: rgba(47,111,224,.18);
    --green: #2e9e57; --red: #d64545; --gray: #8a96a8; --mask: rgba(20,30,50,.45);
    --bg-blur: rgba(244,246,251,.88); --chip-bg: rgba(47,111,224,.1); --input-bg: #ffffff;
    --shadow: 0 10px 30px rgba(30,60,120,.12); --shadow-lg: 0 20px 50px rgba(30,60,120,.2);
    --fav-bg: rgba(20,40,80,.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
    background: radial-gradient(ellipse 60% 40% at 50% -10%, var(--bg-glow), transparent 70%);
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

  /* ---------- Hero ---------- */
  header.hero { padding: 44px 0 22px; display: flex; align-items: flex-start; gap: 18px; }
  .logo-badge {
    width: 54px; height: 54px; flex: none; border-radius: 14px; overflow: hidden;
    box-shadow: var(--shadow); border: 1px solid var(--border-strong);
  }
  .logo-badge img { width: 100%; height: 100%; display: block; }
  .hero-main { flex: 1; min-width: 0; }
  h1 {
    font-size: 26px; font-weight: 800; letter-spacing: .5px;
    background: linear-gradient(120deg, var(--accent), #9be3ff 60%, var(--accent));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .hero-sub { color: var(--dim); font-size: 13.5px; margin-top: 4px; }
  .hero-sub b { color: var(--text); font-weight: 600; }
  .icon-btn {
    width: 38px; height: 38px; flex: none; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--dim); font-size: 17px;
    display: inline-flex; align-items: center; justify-content: center; transition: .18s;
  }
  .icon-btn:hover { color: var(--accent); border-color: var(--border-strong); transform: translateY(-1px); }

  /* ---------- Sticky toolbar ---------- */
  .toolbar {
    position: sticky; top: 0; z-index: 50; padding: 12px 0 10px; margin-top: 6px;
    background: var(--bg-blur); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .toolbar-row { display: flex; gap: 10px; align-items: center; }
  .search-box { position: relative; flex: 1; min-width: 0; }
  .search-box svg {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    width: 15px; height: 15px; color: var(--dim); pointer-events: none;
  }
  #q {
    width: 100%; padding: 10px 14px 10px 36px; border-radius: 11px;
    border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 14px;
    outline: none; transition: .18s;
  }
  #q:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .btn-primary {
    flex: none; padding: 10px 16px; border-radius: 11px; border: none; font-size: 13.5px; font-weight: 600;
    background: linear-gradient(135deg, var(--accent), #7cc7ff); color: #fff;
    box-shadow: 0 4px 14px var(--accent-hover); transition: .18s;
  }
  .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.06); }

  .tabs { display: flex; gap: 8px; margin-top: 11px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: transparent; color: var(--dim); font-size: 13px; font-weight: 500; transition: .15s;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .tab:hover { color: var(--text); border-color: var(--border-strong); }
  .tab.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .tab .n {
    font-size: 11px; padding: 0 6px; border-radius: 999px; background: var(--chip-bg); min-width: 20px; text-align: center;
  }
  .tab.on .n { background: rgba(255,255,255,.25); }

  /* ---------- Grid & cards ---------- */
  main { padding: 24px 0 60px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .card {
    position: relative; display: flex; flex-direction: column; gap: 10px; padding: 16px;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    transition: transform .18s, box-shadow .18s, border-color .18s; animation: pop .35s ease both;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--border-strong); }
  .card-top { display: flex; align-items: center; gap: 11px; }
  .fav {
    width: 40px; height: 40px; flex: none; border-radius: 10px; background: var(--fav-bg);
    border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
    overflow: hidden; font-weight: 700; font-size: 17px; color: #fff;
  }
  .fav img { width: 24px; height: 24px; border-radius: 5px; }
  .fav span { display: none; }
  .fav.noimg span, .fav.hide-img span { display: block; }
  .card-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 7px; min-width: 0; }
  .card-title .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ext { flex: none; width: 13px; height: 13px; color: var(--dim); opacity: 0; transition: .15s; }
  .card:hover .ext { opacity: 1; }
  .card-desc {
    color: var(--dim); font-size: 12.8px; min-height: 38px; max-height: 38px; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: auto; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.offline { background: var(--gray); }
  .status-txt { font-size: 11.5px; color: var(--dim); }
  .chip {
    font-size: 11px; padding: 2px 9px; border-radius: 999px; background: var(--chip-bg); color: var(--accent);
  }
  .chip.own { background: var(--fav-bg); color: var(--dim); }

  /* ---------- Skeleton / empty ---------- */
  .skel { height: 132px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); position: relative; overflow: hidden; }
  .skel::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, var(--accent-soft), transparent);
    animation: shine 1.4s infinite;
  }
  @keyframes shine { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  .empty { text-align: center; color: var(--dim); padding: 70px 0; }
  .empty .big { font-size: 40px; margin-bottom: 10px; }

  /* ---------- Modal ---------- */
  .mask {
    position: fixed; inset: 0; background: var(--mask); backdrop-filter: blur(4px); z-index: 100;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .mask.show { display: flex; }
  .modal {
    width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border-strong);
    border-radius: 16px; padding: 24px; box-shadow: var(--shadow-lg); animation: pop .25s ease;
  }
  .modal h3 { font-size: 17px; margin-bottom: 16px; }
  .field { margin-bottom: 13px; }
  .field label { display: block; font-size: 12.5px; color: var(--dim); margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--input-bg); color: var(--text); font-size: 13.5px; outline: none; transition: .15s;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .modal-foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .btn-ghost { padding: 9px 16px; border-radius: 9px; border: 1px solid var(--border); background: transparent; color: var(--dim); font-size: 13.5px; }
  .btn-ghost:hover { color: var(--text); border-color: var(--border-strong); }
  .form-err { color: var(--red); font-size: 12.5px; min-height: 16px; margin-top: 4px; }

  @media (max-width: 560px) {
    header.hero { padding-top: 28px; }
    h1 { font-size: 21px; }
    .grid { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 400px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="logo-badge"><img src="favicon.svg" alt="logo"></div>
    <div class="hero-main">
      <h1>站点导航</h1>
      <div class="hero-sub" id="heroSub">加载中…</div>
    </div>
    <a class="icon-btn" href="/admin" title="管理后台">⚙️</a>
    <button class="icon-btn" id="themeBtn" title="切换主题">🌙</button>
  </header>
</div>

<div class="toolbar">
  <div class="wrap">
    <div class="toolbar-row">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" placeholder="搜索站点…" autocomplete="off">
      </div>
      <button class="btn-primary" id="addBtn">＋ 添加</button>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>
</div>

<main class="wrap">
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">
    <div class="big">🔍</div>
    <div id="emptyTxt">没有匹配的站点</div>
  </div>
</main>

<div class="mask" id="addMask">
  <div class="modal">
    <h3>添加收藏 / 站点</h3>
    <div class="field">
      <label>类型</label>
      <select id="fCat">
        <option value="collect">收藏夹（外部网站）</option>
        <option value="self">自建站（自己部署的服务）</option>
      </select>
    </div>
    <div class="field"><label>名称 *</label><input id="fName" placeholder="例如：健康监控"></div>
    <div class="field"><label>网址 *</label><input id="fUrl" placeholder="https://…"></div>
    <div class="field"><label>描述</label><input id="fDesc" placeholder="一句话介绍（可选）"></div>
    <div class="field"><label>管理密码</label><input id="fPwd" type="password" placeholder="后台管理密码"></div>
    <div class="form-err" id="fErr"></div>
    <div class="modal-foot">
      <button class="btn-ghost" id="fCancel">取消</button>
      <button class="btn-primary" id="fSubmit">提交</button>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
let ALL = [], TAB = localStorage.getItem('nav-tab') || 'all', KW = '';

/* ---------- 主题 ---------- */
$('#themeBtn').onclick = () => {
  const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
  localStorage.setItem('nav-theme', t);
  $('#themeBtn').textContent = t === 'light' ? '☀️' : '🌙';
};
$('#themeBtn').textContent = document.documentElement.dataset.theme === 'light' ? '☀️' : '🌙';

/* ---------- favicon：站点 favicon -> GitHub 头像 -> 字母色块 三级回退 ---------- */
window.favErr = (el) => {
  if (el.dataset.fb === '1' || !el.dataset.avatar) { el.parentElement.classList.add('hide-img'); return; }
  el.dataset.fb = '1';
  el.src = el.dataset.avatar;
};
function favHTML(s) {
  let host = ''; try { host = new URL(s.url).origin; } catch {}
  const letter = (s.repo || '?').charAt(0).toUpperCase();
  const hue = [...(s.repo + (s.owner || ''))].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);
  const avatar = s.owner ? `https://github.com/${encodeURIComponent(s.owner)}.png?size=64` : '';
  const img = host ? `<img src="${host}/favicon.ico" data-avatar="${esc(avatar)}" loading="lazy" onerror="favErr(this)">` : '';
  return `<div class="fav${host ? '' : ' noimg'}" style="background:linear-gradient(135deg,hsl(${hue},60%,45%),hsl(${(hue+40)%360},60%,38%))">${img}<span>${letter}</span></div>`;
}
const esc = (x) => String(x ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 分类 ---------- */
function catOf(s) {
  if (s.status === 'custom') return s.cat === 'self' ? 'self' : 'collect';
  return '@' + (s.owner || 'unknown').toLowerCase();
}
function renderTabs() {
  const counts = {};
  ALL.forEach((s) => { const c = catOf(s); counts[c] = (counts[c] || 0) + 1; });
  const owners = Object.keys(counts).filter((c) => c.startsWith('@')).sort();
  const order = ['all', ...owners, 'self', 'collect'];
  const names = { all: '全部', self: '自建站', collect: '收藏夹' };
  if (!order.includes(TAB)) TAB = 'all';
  $('#tabs').innerHTML = order.map((c) => {
    const n = c === 'all' ? ALL.length : (counts[c] || 0);
    if (c !== 'all' && !n) return '';
    return `<button class="tab${TAB === c ? ' on' : ''}" data-c="${c}">${esc(names[c] || c.slice(1))}<span class="n">${n}</span></button>`;
  }).join('');
  $('#tabs').querySelectorAll('.tab').forEach((b) => b.onclick = () => {
    TAB = b.dataset.c; localStorage.setItem('nav-tab', TAB);
    document.querySelectorAll('#tabs .tab').forEach((x) => x.classList.toggle('on', x.dataset.c === TAB));
    render();
  });
}

/* ---------- 列表 ---------- */
function match(s) {
  if (TAB !== 'all' && catOf(s) !== TAB) return false;
  if (!KW) return true;
  const hay = [s.repo, s.title, s.description, s.url, s.owner, (s.topics || []).join(' ')].join(' ').toLowerCase();
  return KW.toLowerCase().split(/\s+/).every((w) => hay.includes(w));
}
function render() {
  const list = ALL.filter(match);
  $('#grid').innerHTML = list.map((s, i) => {
    const online = s.status === 'online', custom = s.status === 'custom';
    const cat = catOf(s);
    return `<a class="card" style="animation-delay:${Math.min(i * 30, 400)}ms" href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(s.url)}">
      <div class="card-top">${favHTML(s)}
        <div class="card-title"${s.title ? ` title="${esc(s.repo)}"` : ''}><span class="t">${esc(s.title || s.repo)}</span>
          <svg class="ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </div>
      </div>
      <div class="card-desc">${esc(s.description) || '<span style="opacity:.45">暂无描述</span>'}</div>
      <div class="card-meta">
        ${custom
          ? '<span class="chip">收藏</span>'
          : `<span class="dot ${online ? 'online' : 'offline'}"></span><span class="status-txt">${online ? '在线' : '离线'}</span>`}
        <span class="chip own">@${esc(s.owner || '')}</span>
        ${s.language ? `<span class="chip own">${esc(s.language)}</span>` : ''}
      </div>
    </a>`;
  }).join('');
  $('#empty').style.display = list.length ? 'none' : 'block';
  $('#emptyTxt').textContent = KW ? '没有匹配的站点，换个关键词试试' : '这个分类下还没有站点';
}
function skeleton(n) { $('#grid').innerHTML = Array(n).fill('<div class="skel"></div>').join(''); }

/* ---------- 数据 ---------- */
async function load() {
  skeleton(9);
  try {
    const r = await fetch('/api/sites');
    const d = await r.json();
    ALL = d.sites || [];
    const online = ALL.filter((s) => s.status === 'online').length;
    $('#heroSub').innerHTML = `共收录 <b>${ALL.length}</b> 个站点 · ${online} 个在线`;
    renderTabs(); render();
  } catch {
    $('#empty').style.display = 'block';
    $('#emptyTxt').textContent = '加载失败，请刷新重试';
  }
}

/* ---------- 搜索 ---------- */
let kwTimer;
$('#q').addEventListener('input', (e) => {
  clearTimeout(kwTimer);
  kwTimer = setTimeout(() => { KW = e.target.value.trim(); render(); }, 120);
});
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape') $('#addMask').classList.remove('show');
});

/* ---------- 添加弹窗 ---------- */
function openModal() { $('#fErr').textContent = ''; $('#addMask').classList.add('show'); setTimeout(() => $('#fName').focus(), 50); }
$('#addBtn').onclick = openModal;
$('#fCancel').onclick = () => $('#addMask').classList.remove('show');
$('#addMask').addEventListener('click', (e) => { if (e.target === $('#addMask')) $('#addMask').classList.remove('show'); });
$('#fSubmit').onclick = async () => {
  const err = $('#fErr'); err.textContent = '';
  const name = $('#fName').value.trim(), url = $('#fUrl').value.trim(), pwd = $('#fPwd').value;
  if (!name || !url) return (err.textContent = '名称和网址必填');
  if (!/^https?:\/\//.test(url)) return (err.textContent = '网址需以 http(s):// 开头');
  if (!pwd) return (err.textContent = '请输入管理密码');
  $('#fSubmit').disabled = true;
  try {
    let r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pwd }) });
    if (!r.ok) { err.textContent = '管理密码错误'; return; }
    r = await fetch('/api/admin/manual', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ repo: name, url, description: $('#fDesc').value.trim(), cat: $('#fCat').value }) });
    if (!r.ok) { const d = await r.json().catch(() => ({})); err.textContent = d.error || '提交失败'; return; }
    $('#addMask').classList.remove('show');
    $('#fName').value = $('#fUrl').value = $('#fDesc').value = $('#fPwd').value = '';
    load();
  } catch { err.textContent = '网络错误，请重试'; }
  finally { $('#fSubmit').disabled = false; }
};

load();
</script>
</body>
</html>
